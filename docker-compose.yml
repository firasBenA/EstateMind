# docker-compose.yml — EstateMind complete stack
# Usage:
#   docker-compose up -d
#   docker-compose logs -f django
#   docker-compose down
#
# After first start, pull Ollama models:
#   docker exec estatemind_ollama ollama pull gemma3:4b
#   docker exec estatemind_ollama ollama pull nomic-embed-text

services:

  # ── Django Backend ──────────────────────────────────────────────────────────
  django:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: estatemind_django
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
      - DEBUG=False
      - ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0
      # Override Ollama URL to use Docker service name
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_REPORT_MODEL=gemma3:4b
      # Override OTEL endpoint to use Docker service name
      - OTEL_EXPORTER_OTLP_ENDPOINT=host.docker.internal:4317
      - SIGNOZ_ENABLED=True
      - OTEL_SERVICE_NAME=estatemind-django
      - DEBUG=True   
    volumes:
      # Mount data folder (Prophet PKLs + RAG models) without baking into image
      - ./data:/data:ro
    depends_on:
      - ollama
    restart: unless-stopped
    networks:
      - estatemind_network

  # ── Ollama ──────────────────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: estatemind_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    networks:
      - estatemind_network

volumes:
  ollama_data:

networks:
  estatemind_network:
    driver: bridge
