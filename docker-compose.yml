# docker-compose.yml — EstateMind project services only
# SigNoz runs separately from D:\signoz\deploy\docker\

services:

  postgres:
    image: pgvector/pgvector:pg17
    container_name: estatemind_postgres
    environment:
      POSTGRES_DB: estatemind
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: capTEEMO500
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: estatemind_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  pgdata:
  ollama_data: